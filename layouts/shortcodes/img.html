{{- $alt := .Get "alt" | default "" -}}
{{- if eq $alt "" -}}
  {{- $alt = .Get "caption" | default "" -}}
{{- end -}}
{{- if eq $alt "" -}}
  {{- warnf "img shortcode requires alt (or caption fallback): src=%s in page %s" (.Get "src") .Page.Path -}}
{{- end -}}
<figure {{ if .Get "class" }}class="{{ .Get "class" }}"{{ end }}>
  <img
    src="{{ .Get "src" | absURL }}"
    alt="{{ $alt }}"
    {{ with (.Get "w") }}width="{{ . }}"{{ end }}{{ with (.Get "h") }}
      height="{{ . }}"
    {{ end }}
  />
  {{ if .Get "caption" }}
    <figcaption>
      {{ if .Get "href" }}
        <a href="{{ .Get "href" }}" rel="noopener" target="_blank">{{ .Get "caption" }}</a>
      {{ else }}
        {{ .Get "caption" }}
      {{ end }}
    </figcaption>
  {{ end }}
</figure>
